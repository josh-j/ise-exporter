name: Tests and lint

# Everything in this project is fail-closed, so verification is too. Note that
# `tests/` and `docs/` are intentionally untracked in this repository: the steps
# below run whatever a checkout actually contains, so this is green on a bare
# clone and gates properly in a working tree that has the suite.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and its development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,dashboards]'

      - name: Lint
        run: ruff check ise_exporter3 tools $([ -d tests ] && echo tests)

      - name: Test
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "tests/ is not tracked in this repository; skipping"
          fi

      - name: Verify the generated dashboards are not stale
        # Dashboards are built from tools/build_dashboards3.py and committed.
        # This fails if someone edited the JSON by hand or changed the generator
        # without regenerating.
        run: |
          python tools/build_dashboards3.py --out "${RUNNER_TEMP}/dashboards3"
          for dashboard in dashboards3/*.json; do
            diff -u "${dashboard}" "${RUNNER_TEMP}/dashboards3/$(basename "${dashboard}")"
          done

      - name: Plan the shipped example configuration
        # Exercises the operator-facing path end to end and fails if the example
        # config ever drifts over its own declared budget.
        env:
          ISE_PASS: ci-placeholder
          ISE_DATACONNECT_PASSWORD: ci-placeholder
        run: |
          # Not --strict: the example leaves pxGrid unconfigured, so
          # endpoint_attributes is deliberately unavailable. The budget check
          # below is the gate that matters.
          python -m ise_exporter3 plan --config ise-exporter3.toml.example
          python -m ise_exporter3 plan --config ise-exporter3.toml.example --json \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["fits_budget"], d'

      - name: Build the package
        run: |
          python -m pip install build
          python -m build
